[project]
name = "splitwise-fx"
version = "0.1.0"
description = "Bulk currency conversion for Splitwise expenses"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "whtsky", email = "whtsky@gmail.com" }]
keywords = ["splitwise", "currency", "exchange-rate", "unionpay", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "rich>=13.9",
]

[project.urls]
Homepage = "https://github.com/whtsky/splitwise-fx"
Repository = "https://github.com/whtsky/splitwise-fx"
Issues = "https://github.com/whtsky/splitwise-fx/issues"
Changelog = "https://github.com/whtsky/splitwise-fx/releases"

[project.scripts]
splitwise-fx = "splitwise_fx.cli:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
warn_redundant_casts = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
